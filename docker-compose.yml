version: "3.9"

services:
  nexora-api:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexora:${DB_PASSWORD:-nexora_password}@postgres:5432/nexora_media
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      TEMPORAL_ADDRESS: temporal:7233
    volumes:
      - nexora_input:/media/input
      - nexora_output:/media/output
      - nexora_temp:/media/temp
    depends_on: [postgres, redis, minio, temporal]
    restart: unless-stopped

  nexora-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexora:${DB_PASSWORD:-nexora_password}@postgres:5432/nexora_media
      REDIS_URL: redis://redis:6379
    volumes:
      - nexora_input:/media/input
      - nexora_output:/media/output
      - nexora_temp:/media/temp
    depends_on: [postgres, redis]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: "8G"

  temporal:
    image: temporalio/auto-setup:1.23
    ports: ["7233:7233"]
    environment:
      DB: postgresql
      POSTGRES_USER: nexora
      POSTGRES_PWD: ${DB_PASSWORD:-nexora_password}
      POSTGRES_SEEDS: postgres
    depends_on: [postgres]

  temporal-ui:
    image: temporalio/ui:latest
    ports: ["8080:8080"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexora_password}
      POSTGRES_DB: nexora_media
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes: [redis_data:/data]
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: nexoraadmin
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-nexora_minio_secret}
    volumes: [minio_data:/data]

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-nexora}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning

  loki:
    image: grafana/loki:latest
    ports: ["3100:3100"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  nexora_input:
  nexora_output:
  nexora_temp:
  prometheus_data:
  grafana_data:
